<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="AgroMind Premium v2.1 — Asistent digital pentru agricultură. Gestionare culturi, diagnostic boli, prognoză meteo, calculator îngrășăminte.">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AgroMind Premium v2.1</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="app" id="app">
    <!-- Overlay mobil sidebar -->
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span class="brand-icon">🌾</span>
            <div class="brand-text">
                <h1>AgroMind</h1>
                <span class="badge-premium">⭐ PREMIUM</span>
            </div>
            <button class="btn-icon sidebar-close" id="sidebar-close">✕</button>
        </div>
        <div class="nav-links" id="nav-links"></div>
        <div class="sidebar-footer">
            <button id="theme-toggle" class="btn-icon" title="Dark/Light">🌓</button>
            <button id="export-btn" class="btn-icon" title="Export CSV/JSON">📤</button>
            <span class="connection-status" id="conn-status" title="Online">●</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="content" id="main-content">
        <!-- Mobile Header -->
        <header class="mobile-header">
            <button class="btn-icon hamburger" id="hamburger">☰</button>
            <h2 class="mobile-title">AgroMind</h2>
            <span class="badge-premium mobile-badge">⭐</span>
        </header>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="spinner"></div>
            <p>Se încarcă...</p>
        </div>

        <!-- Toast Container -->
        <div class="toast-container" id="toast-container"></div>

        <!-- DASHBOARD -->
        <div id="dashboard-page" class="page active"></div>

        <!-- CROPS -->
        <div id="crops-page" class="page"></div>

        <!-- DISEASES -->
        <div id="diseases-page" class="page"></div>

        <!-- FERTILIZER -->
        <div id="fertilizer-page" class="page"></div>

        <!-- JOURNAL -->
        <div id="journal-page" class="page"></div>

        <!-- CHARTS -->
        <div id="charts-page" class="page"></div>

        <!-- WEATHER -->
        <div id="weather-page" class="page"></div>
    </main>
</div>

<!-- Export Modal -->
<div id="export-modal" class="modal">
    <div class="modal-content">
        <h3>📤 Export date</h3>
        <p>Selectează formatul:</p>
        <div class="modal-actions">
            <button class="btn-primary" id="export-csv">CSV (Excel)</button>
            <button class="btn-primary" id="export-json">JSON</button>
        </div>
        <button class="btn-secondary" id="export-close">Închide</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
